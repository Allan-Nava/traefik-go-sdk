site_name: Traefik Go SDK
site_description: Go SDK for programmatic Traefik API interaction
site_author: Allan Nava
site_url: https://allan-nava.github.io/traefik-go-sdk/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
    - Installation: guides/01-installation.md
    - Quick Start: guides/02-quick-start.md
    - Configuration: guides/03-configuration.md
  - API Reference:
    - HTTP API: api/http.md
    - TCP API: api/tcp.md
    - UDP API: api/udp.md
    - Info Endpoints: api/info.md
  - Development:
    - TDD Workflow: development/tdd.md
    - Testing: development/testing.md
    - Branch Protection: development/branch-protection.md
    - Contributing: development/contributing.md
  - Architecture:
    - Overview: architecture/overview.md
    - Design Decisions: architecture/decisions.md
    - Roadmap: architecture/roadmap.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.emoji
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Allan-Nava/traefik-go-sdk
  version: 0.2.0
